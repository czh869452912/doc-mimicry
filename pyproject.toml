[project]
name = "docagent-workbench"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "celery[redis]>=5.3",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "testcontainers[postgres]>=4.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = [
  "packages/contracts",
  "packages/workspace",
  "packages/timeline",
  "tools/import",
  "services/api",
  "agent/runtime-adapters/mock",
  "agent/runtime-adapters/openhands"
]
testpaths = [
  "packages",
  "tools",
  "services/api/tests",
  "agent/runtime-adapters/mock/tests",
  "agent/runtime-adapters/openhands/tests"
]
tmp_path_retention_policy = "failed"
cache_dir = ".local/pytest-cache"
addopts = "--basetemp=.local/pytest-tmp"
