[project]
name = "docagent-workbench"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = [
  "packages/contracts",
  "packages/workspace",
  "packages/timeline",
  "tools/import",
  "services/api",
  "agent/runtime-adapters/mock"
]
testpaths = [
  "packages",
  "tools",
  "services/api/tests",
  "agent/runtime-adapters/mock/tests"
]
