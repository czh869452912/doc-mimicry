[project]
name = "docagent-workbench"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "celery[redis]>=5.3",
  "redis>=5.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "testcontainers[postgres]>=4.0",
  "pytest-asyncio>=0.23",
]
openhands = [
  "lmnr==0.7.51",
  "openhands-agent-server==1.20.1",
  "openhands-sdk==1.20.1",
  "openhands-tools==1.20.1",
  "openhands-workspace==1.20.1",
  "opentelemetry-api==1.39.1",
  "opentelemetry-exporter-otlp-proto-common==1.39.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.39.1",
  "opentelemetry-exporter-otlp-proto-http==1.39.1",
  "opentelemetry-instrumentation==0.60b1",
  "opentelemetry-instrumentation-threading==0.60b1",
  "opentelemetry-proto==1.39.1",
  "opentelemetry-sdk==1.39.1",
  "opentelemetry-semantic-conventions==0.60b1",
  "opentelemetry-semantic-conventions-ai==0.4.13",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = [
  "packages/contracts",
  "packages/workspace",
  "packages/timeline",
  "tools/import",
  "services/api",
  "agent/runtime-adapters/mock",
  "agent/runtime-adapters/openhands"
]
testpaths = [
  "packages",
  "tools",
  "services/api/tests",
  "agent/runtime-adapters/mock/tests",
  "agent/runtime-adapters/openhands/tests"
]
tmp_path_retention_policy = "failed"
cache_dir = ".local/pytest-cache"
addopts = "--basetemp=.local/pytest-tmp"
