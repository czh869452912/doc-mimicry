# docker-compose.override.yml — dev overrides: hot reload for api and worker
services:
  api:
    command: uvicorn --factory docagent_api.app:create_app --host 0.0.0.0 --port 8000 --reload
    environment:
      DOCAGENT_REPO_ROOT: ${DOCAGENT_REPO_ROOT:-/app}
      DOCAGENT_RUNTIME: ${DOCAGENT_RUNTIME:-mock}
      OPENHANDS_BASE_URL: ${OPENHANDS_CONTAINER_BASE_URL:-http://openhands:8001}
      LLM_API_KEY: ${LLM_API_KEY:-sk-docagent-local}
      LLM_MODEL: ${LLM_MODEL:-docagent/default}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000}
    volumes:
      - ./services/api:/app/services/api
      - ./packages:/app/packages
      - ./agent/runtime-adapters:/app/agent/runtime-adapters
      - ./tools:/app/tools
      - ./doc-types:/app/doc-types
      - workspace_data:/workspace

  worker:
    command: celery -A docagent_api.celery_app worker --loglevel=info
    environment:
      DOCAGENT_REPO_ROOT: ${DOCAGENT_REPO_ROOT:-/app}
      DOCAGENT_RUNTIME: ${DOCAGENT_RUNTIME:-mock}
      OPENHANDS_BASE_URL: ${OPENHANDS_CONTAINER_BASE_URL:-http://openhands:8001}
      LLM_API_KEY: ${LLM_API_KEY:-sk-docagent-local}
      LLM_MODEL: ${LLM_MODEL:-docagent/default}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000}
    volumes:
      - ./services/api:/app/services/api
      - ./packages:/app/packages
      - ./agent/runtime-adapters:/app/agent/runtime-adapters
      - ./tools:/app/tools
      - ./doc-types:/app/doc-types
      - workspace_data:/workspace
