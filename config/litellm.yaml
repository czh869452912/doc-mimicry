model_list:
  - model_name: docagent/default
    litellm_params:
      model: os.environ/DOCAGENT_LITELLM_DEFAULT_MODEL
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/DOCAGENT_LITELLM_DEFAULT_API_BASE
  - model_name: docagent/fast
    litellm_params:
      model: os.environ/DOCAGENT_LITELLM_FAST_MODEL
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/DOCAGENT_LITELLM_FAST_API_BASE
  - model_name: docagent/reasoning
    litellm_params:
      model: os.environ/DOCAGENT_LITELLM_REASONING_MODEL
      api_key: os.environ/DOCAGENT_LITELLM_REASONING_API_KEY
      api_base: os.environ/DOCAGENT_LITELLM_REASONING_API_BASE
  - model_name: docagent/deepseek
    litellm_params:
      model: os.environ/DOCAGENT_LITELLM_DEEPSEEK_MODEL
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/DOCAGENT_LITELLM_DEEPSEEK_API_BASE
      extra_body:
        thinking:
          type: disabled

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  drop_params: true
