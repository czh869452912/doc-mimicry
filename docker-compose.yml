name: docagent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docagent
      POSTGRES_USER: docagent
      POSTGRES_PASSWORD: docagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://docagent:docagent@postgres:5432/docagent
      REDIS_URL: redis://redis:6379/0
    volumes:
      - workspace_data:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: celery -A docagent_api.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://docagent:docagent@postgres:5432/docagent
      REDIS_URL: redis://redis:6379/0
      DOCAGENT_QUEUE: celery
      DOCAGENT_STATE_ROOT: /workspace/state
    volumes:
      - workspace_data:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  workspace_data:
