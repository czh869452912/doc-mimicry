name: docagent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docagent
      POSTGRES_USER: docagent
      POSTGRES_PASSWORD: docagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:v1.79.0-stable
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-docagent-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DOCAGENT_LITELLM_REASONING_API_KEY: ${DOCAGENT_LITELLM_REASONING_API_KEY:-${OPENAI_API_KEY:-}}
    volumes:
      - type: bind
        source: ./config/litellm.yaml
        target: /app/config.yaml
        read_only: true
    ports:
      - "4000:4000"

  openhands:
    profiles: ["openhands"]
    image: docagent-api
    entrypoint: []
    command: python -m openhands.agent_server --host 0.0.0.0 --port 8001
    environment:
      OPENHANDS_SUPPRESS_BANNER: "1"
      LLM_API_KEY: ${LLM_API_KEY:-sk-docagent-local}
      LLM_MODEL: ${LLM_MODEL:-docagent/default}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000}
    volumes:
      - type: volume
        source: workspace_data
        target: /workspace
    depends_on:
      - litellm
    ports:
      - "8001:8001"

  api:
    image: docagent-api
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://docagent:docagent@postgres:5432/docagent
      REDIS_URL: redis://redis:6379/0
      DOCAGENT_STATE_ROOT: /workspace/state
      DOCAGENT_QUEUE: celery
      DOCAGENT_RUN_MIGRATIONS: "1"
    volumes:
      - workspace_data:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    image: docagent-api
    command: celery -A docagent_api.celery_app worker --loglevel=info --pool=solo --concurrency=1
    environment:
      DATABASE_URL: postgresql+psycopg2://docagent:docagent@postgres:5432/docagent
      REDIS_URL: redis://redis:6379/0
      DOCAGENT_QUEUE: celery
      DOCAGENT_STATE_ROOT: /workspace/state
      DOCAGENT_RUN_MIGRATIONS: "0"
      OPENHANDS_SUPPRESS_BANNER: "1"
    volumes:
      - workspace_data:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: /api
        VITE_ACP_UI_URL: ${VITE_ACP_UI_URL:-}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  workspace_data:
